name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Require macOS 26
        run: |
          sw_vers
          major="$(sw_vers -productVersion | cut -d. -f1)"
          if [ "$major" -lt 26 ]; then
            echo "Need a macOS 26 GitHub-hosted runner or a self-hosted Mac. Got $(sw_vers -productVersion)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          build="$(git rev-list --count HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Archive Release
        run: |
          xcodebuild \
            -project fastpost.xcodeproj \
            -scheme fastpost \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Fastpost.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package DMG and PKG
        run: |
          app="$RUNNER_TEMP/Fastpost.xcarchive/Products/Applications/Fastpost.app"
          if [ ! -d "$app" ]; then
            echo "Archive did not contain Fastpost.app" >&2
            find "$RUNNER_TEMP/Fastpost.xcarchive" -maxdepth 4 -print >&2
            exit 1
          fi
          mkdir -p dist
          scripts/package.sh "$app" "${{ steps.version.outputs.version }}" dist

      - name: Sign and notarize when secrets exist
        run: |
          app="$RUNNER_TEMP/Fastpost.xcarchive/Products/Applications/Fastpost.app"
          version="${{ steps.version.outputs.version }}"
          scripts/sign-and-notarize.sh \
            "$app" \
            "dist/Fastpost-${version}.dmg" \
            "dist/Fastpost-${version}.pkg"
          if [ -n "${APPLE_DEVELOPER_ID_P12:-}" ]; then
            echo "signed=true" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          notes="macOS 26+, Apple Silicon."
          if [ "${signed:-false}" != "true" ]; then
            notes+=$'\n\nThis build is not Developer ID signed or notarized. First launch: right-click Fastpost.app and choose Open, or run `xattr -cr /Applications/Fastpost.app`.'
          fi
          gh release create "$tag" \
            --title "Fastpost $version" \
            --notes "$notes" \
            "dist/Fastpost-${version}.dmg" \
            "dist/Fastpost-${version}.pkg"

      - name: Update Homebrew cask on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          sha="$(shasum -a 256 "dist/Fastpost-${version}.dmg" | awk '{ print $1 }')"
          git fetch origin main
          git checkout -B main origin/main
          scripts/update-cask.sh "$version" "$sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/fastpost.rb
          if git diff --cached --quiet; then
            echo "Cask already at $version"
            exit 0
          fi
          git commit -m "Bump Homebrew cask to $version"
          git push origin main
